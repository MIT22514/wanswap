name: scorecard
on:
  schedule:
    - cron: "30 1 * * 6"
  push:
    branches: [main]
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      # The official ossf/scorecard-action is a Docker action published to gcr.io, and that
      # registry currently refuses pulls ("This API method requires billing to be enabled").
      # Running the CLI avoids the registry entirely; results go to the Security tab as SARIF
      # instead of being published to the public scorecard API (so no score badge).
      - name: Run OpenSSF Scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(curl -sSL https://api.github.com/repos/ossf/scorecard/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          ver=${tag#v}
          curl -sSL -o scorecard.tar.gz "https://github.com/ossf/scorecard/releases/download/${tag}/scorecard_${ver}_linux_amd64.tar.gz"
          tar xzf scorecard.tar.gz
          ./scorecard --repo="github.com/${{ github.repository }}" \
            --format sarif --output results.sarif --show-details || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
