name: scorecard
on:
  schedule:
    - cron: "30 1 * * 6"
  push:
    branches: [main]
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # The official ossf/scorecard-action is a Docker action pulled from gcr.io, and that
      # registry currently refuses pulls ("This API method requires billing to be enabled").
      # The CLI avoids the registry. Note it no longer supports SARIF output, so the score is
      # written to the run summary rather than uploaded to the Security tab.
      - name: Run OpenSSF Scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(curl -sSL https://api.github.com/repos/ossf/scorecard/releases/latest \
                | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          ver=${tag#v}
          curl -sSL -o scorecard.tar.gz \
            "https://github.com/ossf/scorecard/releases/download/${tag}/scorecard_${ver}_linux_amd64.tar.gz"
          tar xzf scorecard.tar.gz
          ./scorecard --repo="github.com/${{ github.repository }}" \
            --format json --output results.json
      - name: Publish score to the run summary
        if: always()
        run: |
          if [ ! -f results.json ]; then
            echo "## OpenSSF Scorecard" >> "$GITHUB_STEP_SUMMARY"
            echo "No results produced - see the step log above." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## OpenSSF Scorecard"
            echo
            echo "| check | score |"
            echo "| --- | --- |"
            jq -r '.checks[] | "| \(.name) | \(.score) |"' results.json
            echo
            jq -r '"**Overall: `\(.score) / 10`**"' results.json
          } >> "$GITHUB_STEP_SUMMARY"
